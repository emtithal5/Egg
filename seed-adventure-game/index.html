<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>مغامرة البذرة في وادي الحياة</title>
<meta name="description" content="لعبة منصات تعليمية لدورة حياة نبات الطماطم والنباتات الحولية والمعمرة — الصف الخامس، منهج كامبردج، سلطنة عُمان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800;900&family=Amiri:wght@700&display=swap">
<style>
/* Layout: one 16:9 stage (1600×900 logical) letterboxed and scaled to the window; HUD and dialogs live inside the stage. */
:root {
  --night: #13301f;      /* letterbox + deep panels */
  --leaf: #1f6b3d;       /* primary green */
  --leaf-dark: #154d2c;
  --gold: #f4c542;       /* stars, borders */
  --parch: #fff7e3;      /* cards */
  --parch-edge: #f0dcae;
  --ink: #2b2118;
  --tomato: #e5482d;
  --sky: #9fd9f2;
  --wrong: #c8442e;
  --hint: #fff1c7;
  --display: "Lalezar", "Tajawal", "Geeza Pro", "Segoe UI", system-ui, sans-serif;
  --body: "Tajawal", "Geeza Pro", "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
  --sign: "Amiri", "Times New Roman", serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at center, #1d4a30 0%, var(--night) 70%);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#stage {
  position: absolute; left: 0; top: 0; width: 1600px; height: 900px;
  transform-origin: 0 0; overflow: hidden; direction: rtl;
  border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  background: var(--sky);
}
#world, #fx { position: absolute; inset: 0; width: 1600px; height: 900px; display: block; }
#fx { pointer-events: none; z-index: 40; }
button { font-family: var(--body); cursor: pointer; }
button:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

/* ---------- HUD ---------- */
#hud { position: absolute; top: 16px; right: 20px; left: 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; pointer-events: none; }
.hud-panel {
  pointer-events: auto; display: flex; align-items: center; gap: 22px;
  background: rgba(255,247,227,.92); border: 3px solid var(--gold); border-radius: 22px;
  padding: 10px 22px 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
.hud-title { font-family: var(--display); font-size: 30px; color: var(--leaf-dark); line-height: 1; padding-top: 4px; }
.hud-sep { width: 2px; align-self: stretch; background: var(--parch-edge); }
#hearts { display: flex; gap: 6px; }
#hearts svg { width: 34px; height: 34px; transition: transform .25s, opacity .25s; }
#hearts svg.lost { opacity: .25; transform: scale(.8); filter: grayscale(1); }
#starBox { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 30px; color: #a86d00; font-variant-numeric: tabular-nums; }
#starBox svg { width: 36px; height: 36px; }
#progress { display: flex; flex-direction: column; gap: 6px; min-width: 260px; }
#progressLabel { font-size: 18px; font-weight: 800; color: var(--leaf-dark); }
#progressBar { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
#progressBar span { height: 14px; border-radius: 7px; background: #e7d7b0; transition: background .4s; }
#progressBar span.done { background: linear-gradient(90deg, #6cc04a, var(--leaf)); }
#progressBar span.now { background: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.hud-btns { pointer-events: auto; display: flex; gap: 10px; direction: ltr; }
.icon-btn {
  width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--gold);
  background: rgba(255,247,227,.94); display: grid; place-items: center; box-shadow: 0 5px 14px rgba(0,0,0,.18);
}
.icon-btn svg { width: 34px; height: 34px; }
.icon-btn:active { transform: scale(.94); }

/* ---------- touch controls ---------- */
.ctrl { position: absolute; z-index: 20; display: flex; gap: 22px; direction: ltr; }
#ctrlMove { left: 28px; bottom: 40px; }
#ctrlJump { right: 34px; bottom: 74px; }
.pad {
  width: 118px; height: 118px; border-radius: 50%; border: 4px solid rgba(255,255,255,.85);
  background: rgba(21,77,44,.55); display: grid; place-items: center; touch-action: none;
  box-shadow: 0 8px 18px rgba(0,0,0,.25); backdrop-filter: blur(2px);
}
.pad svg { width: 56px; height: 56px; }
.pad.on { background: rgba(244,197,66,.85); transform: scale(.95); }
#btnJump { width: 138px; height: 138px; flex-direction: column; gap: 0; color: #fff; font-weight: 900; font-size: 22px; }
#btnJump svg { width: 50px; height: 50px; }

#signature {
  position: absolute; z-index: 21; right: 30px; bottom: 14px; font-family: var(--sign); font-size: 26px;
  color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); display: flex; align-items: center; gap: 8px; pointer-events: none; opacity: .92;
}
#signature svg { width: 26px; height: 26px; }

/* ---------- speech bubble ---------- */
#bubble {
  position: absolute; z-index: 25; max-width: 560px; min-width: 220px; transform: translate(-50%, -100%);
  background: #fff; border: 4px solid var(--leaf); border-radius: 28px; padding: 16px 24px 14px;
  font-size: 27px; font-weight: 700; line-height: 1.55; color: var(--ink); box-shadow: 0 10px 24px rgba(0,0,0,.22);
  pointer-events: none; text-wrap: pretty;
}
#bubble::after {
  content: ""; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
  border: 16px solid transparent; border-top: 18px solid var(--leaf); border-bottom: 0;
}
#bubble b { color: var(--leaf); }

/* ---------- fact card ---------- */
#fact {
  position: absolute; z-index: 22; top: 120px; left: 50%; transform: translateX(-50%); width: 900px;
  background: var(--parch); border: 4px solid var(--gold); border-radius: 26px; padding: 16px 30px 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,.25); display: flex; gap: 20px; align-items: center; cursor: pointer;
  animation: drop .45s cubic-bezier(.2,1.4,.4,1);
}
#fact .fact-badge { flex: 0 0 auto; width: 70px; height: 70px; border-radius: 50%; background: var(--leaf); display: grid; place-items: center; }
#fact .fact-badge svg { width: 40px; height: 40px; }
#fact h3 { font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--leaf-dark); margin: 0 0 2px; }
#fact p { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.55; }
@keyframes drop { from { transform: translate(-50%, -40px); opacity: 0; } }

#tip {
  position: absolute; z-index: 22; bottom: 200px; left: 50%; transform: translateX(-50%);
  background: rgba(19,48,31,.85); color: #fff; border-radius: 40px; padding: 12px 30px 10px; font-size: 25px; font-weight: 700;
  border: 3px solid var(--gold); white-space: nowrap;
}

/* ---------- intro ---------- */
#intro { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
#introTitle {
  position: absolute; top: 46px; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap;
  font-family: var(--display); font-size: 88px; line-height: 1.1; color: #fff;
  text-shadow: 0 5px 0 var(--leaf-dark), 0 10px 26px rgba(0,0,0,.45); transition: opacity .8s, transform .8s;
}
#introTitle small { display: block; font-family: var(--body); font-weight: 800; font-size: 30px; color: #fff4c4; text-shadow: 0 2px 8px rgba(0,0,0,.6); margin-top: 6px; }
#btnStart {
  position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); pointer-events: auto;
  font-family: var(--display); font-size: 48px; color: #fff; padding: 18px 64px 10px; border-radius: 60px; border: 5px solid #fff3c4;
  background: linear-gradient(180deg, #ff7a4f, var(--tomato)); box-shadow: 0 10px 0 #a52c17, 0 18px 30px rgba(0,0,0,.35);
  animation: bob 1.6s ease-in-out infinite;
}
#btnStart:active { transform: translate(-50%, 6px); box-shadow: 0 4px 0 #a52c17; }
@keyframes bob { 50% { transform: translate(-50%, -8px); } }
#btnSkip {
  position: absolute; left: 30px; top: 30px; pointer-events: auto; font-size: 22px; font-weight: 800; color: var(--leaf-dark);
  background: rgba(255,247,227,.92); border: 3px solid var(--gold); border-radius: 30px; padding: 8px 22px 6px;
}

/* ---------- question modal ---------- */
.modal { position: absolute; inset: 0; z-index: 35; display: grid; place-items: center; background: rgba(12,32,20,.45); }
.qcard {
  width: 1000px; background: var(--parch); border: 6px solid var(--gold); border-radius: 36px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.4); animation: pop .4s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
.qhead { background: linear-gradient(180deg, #2a8a50, var(--leaf)); color: #fff; padding: 18px 34px 12px; display: flex; align-items: center; gap: 18px; }
.qhead .gate-num { font-weight: 900; font-size: 22px; background: rgba(255,255,255,.18); border-radius: 20px; padding: 4px 16px 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.qhead h2 { font-family: var(--display); font-weight: 400; font-size: 44px; margin: 0; line-height: 1.2; }
.qbody { padding: 26px 40px 30px; display: flex; flex-direction: column; gap: 18px; }
#qText { font-size: 36px; font-weight: 800; line-height: 1.5; margin: 0; text-wrap: balance; }
#qOpts { display: grid; gap: 14px; }
.opt {
  display: flex; align-items: center; gap: 20px; text-align: right; width: 100%; min-height: 86px; padding: 10px 22px;
  background: #fff; border: 4px solid var(--parch-edge); border-radius: 22px; font-size: 32px; font-weight: 800; color: var(--ink);
  box-shadow: 0 5px 0 var(--parch-edge); transition: background .2s, border-color .2s;
}
.opt .letter { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--leaf); color: #fff; font-size: 30px; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.correct { background: #dff5d3; border-color: #4caf50; box-shadow: 0 5px 0 #4caf50; }
.opt.correct .letter { background: #2e9b3e; }
.opt.wrong { background: #fde3dc; border-color: var(--wrong); box-shadow: 0 5px 0 var(--wrong); animation: shake .45s; }
.opt.wrong .letter { background: var(--wrong); }
.opt:disabled { cursor: default; }
.opt.faded { opacity: .45; }
@keyframes shake { 20%,60% { transform: translateX(-12px); } 40%,80% { transform: translateX(12px); } }
#qHint {
  display: flex; gap: 14px; align-items: flex-start; background: var(--hint); border: 3px dashed #e3b23c; border-radius: 20px;
  padding: 14px 20px; font-size: 26px; font-weight: 700; line-height: 1.55;
}
#qHint strong { color: #a5520f; white-space: nowrap; }
.qfoot { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; color: #7b6a4c; }

/* ---------- end screens ---------- */
#endOverlay { position: absolute; inset: 0; z-index: 36; display: grid; place-items: center; background: rgba(12,32,20,.35); }
.endcard {
  width: 1240px; max-height: 820px; background: var(--parch); border: 6px solid var(--gold); border-radius: 40px;
  box-shadow: 0 24px 60px rgba(0,0,0,.4); padding: 26px 46px 30px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  animation: pop .5s cubic-bezier(.2,1.4,.4,1);
}
.endcard h2 { font-family: var(--display); font-weight: 400; font-size: 54px; color: var(--leaf-dark); margin: 0; text-align: center; line-height: 1.2; text-wrap: balance; }
.endcard .sub { font-size: 26px; font-weight: 700; margin: 0; color: #5d4b2f; text-align: center; }
#cycleCanvas { width: 900px; height: 560px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; width: 100%; }
.cmp-card { border-radius: 28px; padding: 18px 24px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.cmp-card.annual { background: #fff0e4; border: 4px solid #f0a46a; }
.cmp-card.perennial { background: #e6f5df; border: 4px solid #6cbf4a; }
.cmp-card h3 { font-family: var(--display); font-weight: 400; font-size: 42px; margin: 0; }
.cmp-card.annual h3 { color: #b4501b; }
.cmp-card.perennial h3 { color: var(--leaf-dark); }
.cmp-card canvas { width: 520px; height: 230px; }
.cmp-card ul { margin: 0; padding: 0 28px 0 0; font-size: 27px; font-weight: 700; line-height: 1.6; align-self: stretch; }
.stats { display: flex; gap: 24px; }
.stat { background: #fff; border: 4px solid var(--parch-edge); border-radius: 26px; padding: 14px 30px 10px; text-align: center; min-width: 330px; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 64px; color: var(--leaf); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 24px; font-weight: 700; color: #5d4b2f; }
.medal { display: flex; gap: 10px; }
.medal svg { width: 64px; height: 64px; }
.credit { font-family: var(--sign); font-size: 40px; color: var(--leaf-dark); display: flex; align-items: center; gap: 12px; margin-top: 2px; }
.credit svg { width: 38px; height: 38px; }
.btn-main {
  font-family: var(--display); font-size: 38px; color: #fff; padding: 12px 54px 6px; border-radius: 50px; border: 4px solid #fff3c4;
  background: linear-gradient(180deg, #34a35c, var(--leaf)); box-shadow: 0 8px 0 #0f3d22;
}
.btn-main:active { transform: translateY(5px); box-shadow: 0 3px 0 #0f3d22; }
.btn-row { display: flex; gap: 20px; }

@media (prefers-reduced-motion: reduce) {
  #btnStart, #progressBar span.now { animation: none; }
}
</style>

<div id="app">
  <div id="stage" aria-label="مغامرة البذرة في وادي الحياة">
    <canvas id="world" width="1600" height="900"></canvas>

    <div id="hud" hidden>
      <div class="hud-panel">
        <div class="hud-title">وادي الحياة</div>
        <div class="hud-sep"></div>
        <div id="hearts" aria-label="فرص المحاولة"></div>
        <div class="hud-sep"></div>
        <div id="starBox" aria-label="النجوم"><svg viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.4 7 1-5.1 4.9 1.2 7L12 17.8l-6.2 3.3 1.2-7L1.9 9.2l7-1z" fill="#f4c542" stroke="#c98a00" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="starCount">٠</span></div>
        <div class="hud-sep"></div>
        <div id="progress"><div id="progressLabel">البوابات: ٠ / ٨</div><div id="progressBar"></div></div>
      </div>
      <div class="hud-btns">
        <button class="icon-btn" id="btnSound" aria-label="كتم الصوت" title="الصوت"></button>
        <button class="icon-btn" id="btnRestart" aria-label="إعادة اللعب" title="إعادة اللعب"><svg viewBox="0 0 24 24" fill="none" stroke="#1f6b3d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 3.5v5h5"/></svg></button>
        <button class="icon-btn" id="btnFull" aria-label="ملء الشاشة" title="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="#1f6b3d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>

    <div id="ctrlMove" class="ctrl" hidden>
      <button class="pad" id="btnLeft" aria-label="تحرّكي يسارًا"><svg viewBox="0 0 24 24"><path d="M15.5 4.5L8 12l7.5 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="pad" id="btnRight" aria-label="تحرّكي يمينًا"><svg viewBox="0 0 24 24"><path d="M8.5 4.5L16 12l-7.5 7.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="ctrlJump" class="ctrl" hidden>
      <button class="pad" id="btnJump" aria-label="اقفزي"><svg viewBox="0 0 24 24"><path d="M5 14l7-7 7 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>قفز</button>
    </div>

    <div id="bubble" hidden></div>
    <div id="fact" hidden></div>
    <div id="tip" hidden>تحرّكي بالسهمين ← →، واقفزي بالمسافة أو بزر «قفز»</div>

    <div id="intro">
      <div id="introTitle">مغامرة البذرة<small>في وادي الحياة</small></div>
      <button id="btnSkip">تخطّي المقدمة</button>
      <button id="btnStart" hidden>ابدئي المغامرة</button>
    </div>

    <div id="qModal" class="modal" hidden>
      <div class="qcard" role="dialog" aria-modal="true" aria-labelledby="qTitle">
        <div class="qhead"><span class="gate-num" id="qGateNum"></span><h2 id="qTitle"></h2></div>
        <div class="qbody">
          <p id="qText"></p>
          <div id="qOpts"></div>
          <div id="qHint" hidden></div>
          <div class="qfoot"><span>اختاري الإجابة الصحيحة لتُفتح البوابة</span><span>المفاتيح: ١ ٢ ٣</span></div>
        </div>
      </div>
    </div>

    <div id="endOverlay" hidden></div>

    <div id="signature"><svg viewBox="0 0 64 64"><path d="M8 56C8 28 28 8 58 6 56 36 36 56 8 56Z" fill="#7cc36a"/><path d="M10 54C24 40 38 26 54 10" stroke="#2f6b2a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>أ. إمتثال العطابي</div>

    <canvas id="fx" width="1600" height="900"></canvas>
  </div>
</div>

<script>
(() => {
"use strict";
/* =========================================================
   Constants & content
   ========================================================= */
const W = 1600, H = 900, GROUND = 760;
const VALLEY_X = 560, START_X = 330, GATE0 = 1650, GATE_GAP = 1150;
const GARDEN_X = 10820, WORLD_END = 11600;
const gateX = i => GATE0 + i * GATE_GAP;
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const LETTERS = ["أ", "ب", "ج"];
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const GATES = [
  { title: "سر البداية", q: "بماذا تبدأ دورة حياة نبات الطماطم؟", opts: ["زهرة", "بذرة", "ثمرة"], ok: 1,
    hint: "فكّري: ما الذي نزرعه في التربة لينمو منه نبات جديد؟",
    say: "رائع! هكذا أبدأ حياتي… بذرة صغيرة داخل التربة!",
    fact: "تبدأ دورة حياة نبات الطماطم ببذرة صغيرة داخل التربة." },
  { title: "الاستيقاظ", q: "ما العملية التي تبدأ فيها البذرة بالنمو؟", opts: ["التلقيح", "الإنبات", "انتشار البذور"], ok: 1,
    hint: "هي العملية التي يخرج فيها الجُذَير من البذرة عندما يتوفر الماء والدفء والهواء.",
    say: "انظرن! خرج الجُذَير إلى الأسفل، والبادرة إلى الأعلى!",
    fact: "الإنبات: تنبت البذرة عندما تتوفر الظروف المناسبة، فيخرج الجُذَير إلى الأسفل وتنمو البادرة نحو الأعلى." },
  { title: "النبتة الصغيرة", q: "ماذا ينتج عن نمو البذرة بعد الإنبات؟", opts: ["شتلة", "ثمرة", "زهرة"], ok: 0,
    hint: "بعد الإنبات تظهر نبتة صغيرة لها أوراق خضراء قليلة.",
    say: "أصبحتُ شتلة صغيرة لها أوراق خضراء!",
    fact: "تنمو البادرة لتصبح شتلة لها أوراق خضراء صغيرة، ثم تكبر لتصبح نباتًا ناضجًا." },
  { title: "سر الأزهار", q: "ماذا يُنتج نبات الطماطم الناضج قبل تكوّن الثمار؟", opts: ["أزهارًا", "ثمارًا ناضجة مباشرة", "بذورًا خارج الثمرة"], ok: 0,
    hint: "قبل أن تتكوّن الثمار، تتفتح على النبات أجزاء صفراء جميلة.",
    say: "تفتحت أزهاري الصفراء! ما أجملها!",
    fact: "يُنتج نبات الطماطم الناضج أزهارًا صفراء، ومنها تتكوّن الثمار لاحقًا." },

   ========================================================= */
const HW = 34;
function solids() {

}

function stepPhysics(dt) {

  if (dir) player.face = dir;
  const S = solids();

  const ox = player.x;
  player.x += player.vx * dt;
  for (const s of S) {
    const overlapY = player.y > s.top + 4;
    if (!overlapY) continue;
    if (player.x + HW > s.x && player.x - HW < s.x + s.w) {
      if (ox <= s.x + s.w / 2) player.x = s.x - HW; else player.x = s.x + s.w + HW;
      player.vx = 0;

  player.coyote -= dt; player.jumpBuf -= dt;

    player.vy = -1060; player.onGround = false; player.coyote = 0; player.jumpBuf = 0; player.squash = -0.18; SFX.jump();
  }
  const oy = player.y;
  player.vy += 2600 * dt; player.vy = Math.min(player.vy, 1800);
  player.y += player.vy * dt;
  let floor = overGap(player.x) ? Infinity : GROUND;
  for (const s of platforms) {
    if (player.x + HW * 0.6 > s.x && player.x - HW * 0.6 < s.x + s.w && oy <= s.top + 1) floor = Math.min(floor, s.top);
  }
  const was = player.onGround;
  if (player.y >= floor) {
    player.y = floor; if (!was && player.vy > 400) player.squash = 0.2;
    player.vy = 0; player.onGround = true; player.coyote = 0.1;
  } else {
    if (was) player.coyote = 0.1;
    player.onGround = false;
  }
  if (player.y > GROUND + 120) { // fell into the falaj: splash and return to the bank
    const g = gaps.find(g => player.x > g.x - 20 && player.x < g.x + g.w + 20) || gaps[0];
    const s = worldToScreen(player.x, GROUND + 10); splash(s.x, s.y); SFX.splash();

    say("بلّلني ماء الفلج! لنقفز فوقه هذه المرة.", 3200);
  }
  player.walk += Math.abs(player.vx) * dt * 0.035;
  player.squash *= Math.pow(0.0015, dt);
  // gate proximity trigger
  for (const g of gates) if (!g.opened && mode === "play" && player.x > g.x - 150 && player.x < g.x) { askGate(g.i); break; }

}

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  time += dt;
  if (mode === "intro") updateIntro(dt);
  if (mode === "play") stepPhysics(dt);
  if (mode === "end") updateEnd(dt);
  if (player.talk > 0) player.talk -= dt;
  if (player.wave > 0) player.wave -= dt;
  // camera follow
  if (mode !== "intro") {
    const target = clamp(player.x - 620, 0, WORLD_END - W);
    cam.x += (target - cam.x) * Math.min(1, dt * 5);
    cam.zoom += (1 - cam.zoom) * Math.min(1, dt * 3);
  }
  requestAnimationFrame(frame);
  try { render(); positionBubble(); updateFx(dt); }
  catch (err) { if (!frame.warned) { frame.warned = true; console.error(err); } }
}

  const sc = idx === 6 ? 1.45 : 0.82, by = idx === 6 ? cv.height - 100 : cv.height - 64;
  function draw(now) {
    if (!document.body.contains(cv)) return;
    const t = (now - t0) / 1000;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    c.fillStyle = idx === 6 ? "#ffe6d1" : "#d3ecc8"; rr(c, 0, 0, cv.width, cv.height, 40); c.fill();
    c.save(); c.translate(cv.width / 2, by); c.scale(sc, sc);
    withCtx(c, () => stageVisual(c, idx, 0, 0, clamp(t / 1.8, 0, 1), t));
    c.restore();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
