<title>نموش في مختبر الإنزيمات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: home = Nizwa sky band with Nmoosh + station grid; lab = white stage (SVG) + side panel; signature pinned to the bottom edge */
:root{
  --bg:#FFFFFF; --ink:#22193A; --muted:#655C7A; --line:#E6E1F0; --soft:#F7F4FD;
  --purple:#6B4BD0; --purple-d:#46299E; --purple-l:#EEE8FD;
  --orange:#F28C28; --orange-d:#B25A0E; --orange-l:#FFF1E3; --gold:#F6C343;
  --ok:#137A53; --ok-l:#E2F4EB; --warn:#B0421A; --warn-l:#FDEEE6;
  --sky:#D7ECFA; --sky2:#FBF0DC; --sand:#EAD2A4; --fort:#D5AE77; --fort-d:#A57E4B;
  --f-display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;direction:rtl}
button{font:inherit;color:inherit}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#app{min-height:100%;padding-bottom:64px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin-inline:auto}

/* ---------- Home ---------- */
.hero{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:28px 0;display:grid;gap:8px}
.eyebrow{font-weight:600;color:var(--purple-d);letter-spacing:.02em;font-size:15px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5.4vw,60px);line-height:1.15;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--purple)}
.hero p.lead{margin:0;max-width:60ch;color:var(--muted);font-size:18px}
.scene{display:block;width:100%;height:auto;max-height:340px;margin-top:6px}
.home-main .wrap{padding-block:28px 24px;display:grid;gap:18px}
.home-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.home-head h2{font-family:var(--f-display);font-size:28px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.st-card{display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;text-align:right;background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;min-height:190px;transition:border-color .2s,transform .2s}
.st-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.st-num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--purple-l);color:var(--purple-d);font-family:var(--f-display);font-weight:800;font-size:24px}
.st-card.final .st-num{background:var(--orange-l);color:var(--orange-d)}
.st-card h3{margin:4px 0 0;font-family:var(--f-display);font-size:21px;line-height:1.3}
.st-card p{margin:0;color:var(--muted);font-size:15px}
.chip{justify-self:start;font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.done{background:var(--ok-l);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;border-radius:14px;border:2px solid var(--purple);background:var(--purple);color:#fff;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:hover{background:var(--purple-d);border-color:var(--purple-d)}
.btn.line{background:#fff;color:var(--purple-d)}
.btn.line:hover{background:var(--purple-l)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#2a1503}
.btn.orange:hover{background:#e07a15}
.btn.small{min-height:40px;padding:4px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* ---------- Lab ---------- */
.labbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:#fff;border-bottom:1px solid var(--line)}
.labbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.lab-title{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px}
.lab-title .st-num{flex:none}
.lab-title h1{font-family:var(--f-display);font-size:clamp(20px,2.4vw,27px);margin:0;line-height:1.25}
.lab-nav{display:flex;gap:8px;flex-wrap:wrap}
.lab-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,370px);gap:20px;align-items:start;padding-block:16px}
@media (max-width:920px){.lab-body{grid-template-columns:minmax(0,1fr)}}
.stage-col{min-width:0;display:grid;gap:10px}
.stage-box{border:1px solid var(--line);border-radius:22px;background:#fff;overflow:hidden}
#stage{display:block;width:100%;height:auto;max-height:calc(100vh - 250px);min-height:220px;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff}
.status{margin:0;min-height:56px;padding:10px 16px;border-radius:14px;background:var(--soft);font-size:17px;font-weight:500}
.status.ok{background:var(--ok-l);color:var(--ok)}
.status.warn{background:var(--warn-l);color:var(--warn)}
.controls{display:flex;flex-wrap:wrap;gap:10px}
.controls .btn{flex:1 1 140px}
.panel{display:grid;gap:12px;min-width:0}
.card{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:#fff}
.card h3{margin:0 0 6px;font-family:var(--f-display);font-size:19px;color:var(--purple-d)}
.card p{margin:0 0 8px}
.card ol,.card ul{margin:0;padding-inline-start:20px}
.card.q{border:2px solid var(--orange);background:var(--orange-l)}
.card.q h3{color:var(--orange-d)}
.card.book{background:var(--soft);border-color:transparent;font-size:15px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-block:6px}
.choices .btn{flex:1 1 90px}
.fb{margin-top:8px!important;font-weight:500}
.fb.ok{color:var(--ok)} .fb.warn{color:var(--warn)}
.steps{list-style:none;padding:0!important;display:grid;gap:6px}
.steps li{padding:6px 12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:15px}
.steps li.on{background:var(--purple);color:#fff;font-weight:600}
.steps li.past{background:var(--purple-l);color:var(--purple-d)}
.tabs{display:flex;gap:8px}
.tabs .btn{flex:1}
.counter{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.counter b{font-family:var(--f-display);font-size:28px;color:var(--purple-d);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;resize:vertical;background:#fff;color:var(--ink)}
.model{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--ok-l);color:#0f4f37}
.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.crumbs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;min-height:38px}
.crumbs button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.crumbs button:disabled{opacity:.4;cursor:not-allowed}
.mol-fig{width:100%;height:auto;display:block}

/* ---------- SVG drawing ---------- */
svg text{font-family:var(--f-body);direction:rtl}
.lbl{font-size:22px;font-weight:600;fill:var(--ink);text-anchor:middle}
.h{font-family:var(--f-display);font-size:30px;font-weight:700;fill:var(--ink);text-anchor:middle}
.name{font-size:21px;font-weight:700;fill:var(--orange-d);text-anchor:middle;transition:opacity .8s}
.state{font-size:20px;font-weight:600;fill:var(--purple-d);text-anchor:middle}
.h2{font-size:19px;font-weight:700;fill:var(--muted);text-anchor:middle}
.mini{font-size:14px;font-weight:600;fill:var(--muted);text-anchor:middle}
.chem{font-size:15px;font-weight:700;fill:#1f5f96;text-anchor:middle;direction:ltr}
.axis-l{font-size:22px;font-weight:700;fill:var(--ink);text-anchor:middle}
.tag rect{fill:#fff;stroke:var(--purple);stroke-width:2}
.tag text{font-size:18px;font-weight:600;fill:var(--purple-d)}
.tag.o rect{stroke:var(--orange-d);fill:var(--orange-l)} .tag.o text{fill:var(--orange-d)}
.tag.ok rect{stroke:var(--ok);fill:var(--ok-l)} .tag.ok text{fill:var(--ok)}
.enz{fill:url(#gEnz);stroke:#3B2190;stroke-width:4;stroke-linejoin:round}
.ghost{fill:none;stroke:#1d1433;stroke-width:3;stroke-dasharray:9 7;stroke-linejoin:round}
.sub{fill:var(--orange);stroke:var(--orange-d);stroke-width:3;stroke-linejoin:round}
.sub-dot{fill:#FFD9AE}
.pA{fill:var(--orange);stroke:var(--orange-d);stroke-width:3;stroke-linejoin:round}
.pB{fill:var(--gold);stroke:#A87D06;stroke-width:3;stroke-linejoin:round}
.prodA{fill:#2E9E5B;stroke:#1b6b3c;stroke-width:3;stroke-linejoin:round}
.prodB{fill:#1E98B0;stroke:#11677a;stroke-width:3;stroke-linejoin:round}
.bond{fill:#fff;stroke:#1d1433;stroke-width:3}
.tray{fill:var(--soft);stroke:var(--line);stroke-width:2;stroke-dasharray:8 6}
.bin{fill:#F4FBF7;stroke:#BFE3CF;stroke-width:2}
.flash{fill:#FFE7A3}
.hint-arrow{fill:none;stroke:var(--purple-d);stroke-width:5;stroke-linecap:round}
.drag{cursor:grab}
.dragging{cursor:grabbing}
.tap{cursor:pointer}
.glyc{stroke:#8A4B12;stroke-width:6;stroke-linecap:round}
.cross{stroke:#9C97AE;stroke-width:7;stroke-linecap:round}
.inset{fill:#fff;stroke:var(--line);stroke-width:2}
.pcard{fill:#fff;stroke:var(--line);stroke-width:3}
.pcard-g.sel .pcard{stroke:var(--orange);stroke-width:5;fill:var(--orange-l)}
.grid-l{stroke:#EFEBF6;stroke-width:1}
.lvl{stroke:var(--muted);stroke-width:2.5;stroke-dasharray:10 8}
.cU{fill:none;stroke:#5E5873;stroke-width:6;stroke-linecap:round}
.cC{fill:none;stroke:var(--purple);stroke-width:6;stroke-linecap:round}
.axis{stroke:var(--ink);stroke-width:3}
.cell{fill:#E3F3DF}
.wall{fill:none;stroke:#3E8E4A;stroke-width:14;stroke-linecap:round}
.h2o{fill:#3B8FD9}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.blink{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.ring{fill:none;stroke:var(--orange);stroke-width:4;animation:ring 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}
#stage.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.bob,.ring{animation:none}}

/* ---------- Signature ---------- */
.sig{position:fixed;inset:auto 0 0 0;z-index:30;background:rgba(255,255,255,.95);border-top:1px solid var(--line);text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--purple-d);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
</style>

<div id="app">
  <section id="home">
    <header class="hero">
      <div class="wrap">
        <span class="eyebrow">الأحياء · الصف الحادي عشر · الوحدة الثالثة: الإنزيمات</span>
        <h1>نموش في <em>مختبر الإنزيمات</em></h1>
        <p class="lead">خمس محطات تفاعلية من فرضية القفل والمفتاح حتى خفض طاقة التنشيط. افتحي أي محطة مباشرة، وأكملي من حيث توقّفتِ في الحصة التالية.</p>
      </div>
      <svg class="scene" viewBox="0 0 1200 360" role="img" aria-label="نموش أمام قلعة نزوى وأشجار النخيل وجبال الحجر">
        <defs>
          <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7ECFA"/><stop offset="1" stop-color="#FBF0DC"/></linearGradient>
        </defs>
        <circle cx="1060" cy="70" r="40" fill="#FFD98A"/>
        <path d="M0 230 L110 150 L210 200 L340 105 L470 190 L590 125 L700 205 L840 110 L980 185 L1090 135 L1200 190 L1200 360 L0 360 Z" fill="#CDAA86" opacity=".55"/>
        <path d="M0 265 L140 205 L260 240 L380 180 L520 250 L650 200 L780 255 L940 195 L1080 245 L1200 220 L1200 360 L0 360 Z" fill="#B88E66" opacity=".7"/>
        <rect x="0" y="292" width="1200" height="68" fill="#EAD2A4"/>
        <path d="M330 340 C 520 318, 700 350, 900 330 S 1120 322, 1200 330" fill="none" stroke="#6CB8D8" stroke-width="9" stroke-linecap="round"/>
        <!-- Nizwa fort round tower -->
        <g>
          <path d="M760 300 L774 150 L936 150 L950 300 Z" fill="#D5AE77"/>
          <path d="M880 150 L936 150 L950 300 L895 300 Z" fill="#BE9660"/>
          <rect x="766" y="132" width="178" height="22" fill="#C99F66"/>
          <g fill="#C99F66">
            <rect x="766" y="118" width="16" height="16"/><rect x="792" y="118" width="16" height="16"/><rect x="818" y="118" width="16" height="16"/><rect x="844" y="118" width="16" height="16"/><rect x="870" y="118" width="16" height="16"/><rect x="896" y="118" width="16" height="16"/><rect x="922" y="118" width="16" height="16"/>

          </g>
          <!-- head -->
          <ellipse cx="0" cy="-180" rx="54" ry="60" fill="#fff" stroke="#DCD5EA" stroke-width="3"/>
          <circle cx="0" cy="-174" r="38" fill="#F3CFA8"/>
          <path d="M-40 -186 Q 0 -232 40 -186 Q 0 -206 -40 -186 Z" fill="#fff"/>
          <rect x="-36" y="-226" width="72" height="18" rx="9" fill="#7CC6E8" stroke="#3E89AE" stroke-width="2"/>

      </svg>
    </header>
    <main class="home-main">
      <div class="wrap">
        <div class="home-head">
          <h2>محطات المختبر</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <button class="btn orange" id="resumeBtn" type="button">ابدئي من المحطة الأولى</button>
            <button class="link-btn" id="clearBtn" type="button">مسح علامات الإنجاز</button>
          </div>
        </div>
        <div class="grid" id="cards"></div>
      </div>
    </main>
  </section>

  <section id="lab" hidden>
    <header class="labbar">
      <div class="wrap">
        <button class="btn line small" id="menuBtn" type="button">☰ القائمة</button>
        <div class="lab-title"><span class="st-num" id="labNum">١</span><h1 id="labTitle"></h1></div>
        <nav class="lab-nav" aria-label="التنقل بين المحطات">
          <button class="btn line small" id="prevBtn" type="button">→ السابقة</button>
          <button class="btn line small" id="nextBtn" type="button">التالية ←</button>
        </nav>
      </div>
    </header>
    <div class="wrap">
      <div class="lab-body">
        <div class="stage-col">
          <div class="stage-box" id="stageBox"></div>
          <p class="status" id="status" aria-live="polite"></p>
          <div class="controls">
            <button class="btn" id="stepBtn" type="button">خطوة واحدة</button>
            <button class="btn line" id="pauseBtn" type="button">إيقاف</button>
            <button class="btn line" id="resetBtn" type="button">إعادة التجربة</button>
          </div>
        </div>
        <aside class="panel" id="panel"></aside>
      </div>
    </div>
  </section>
  <footer class="sig">أ.إمتثال العطابي</footer>

<script>
(function(){

    else{tag(L3,ax.C+128,(yR+pkC)/2+6,'طاقة التنشيط بوجود الإنزيم','');phase='done';afb.textContent='اكتمل السهمان. قارني طوليهما.';
      const ok=pred==='C';pfb.className='fb '+(ok?'ok':'warn');pfb.textContent=ok?'توقّعكِ صحيح ✓ قمّة المسار بوجود الإنزيم أقل، فسهم طاقة التنشيط أقصر.':'توقّعتِ المسار بدون إنزيم، لكن السهمين يبيّنان أن طاقة التنشيط بوجود الإنزيم أقل (السهم أقصر).';
      say('السهم بوجود الإنزيم أقصر: طاقة التنشيط أقل، ومستويا طاقة المتفاعلات والنواتج لم يتغيّرا. أجيبي عن السؤال الختامي.','ok');
      extra.hidden=false;molFig();fq.hidden=false;ctx.done();}}
  svg.addEventListener('pointerdown',e=>{if(phase!=='arrow'||busy&&busyGen===A.gen)return;const p=svgPt(svg,e);if(Math.abs(p.y-yR)>40||p.x<GX0||p.x>GX1){say('ابدئي السهم من خط مستوى طاقة المتفاعلات (الخط المنقّط العلوي).','warn');return;}
    drawing=cur;drawArrow(cur,Math.min(p.y,yR-30));});
  svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=svgPt(svg,e);drawArrow(drawing,Math.max(GY0+10,Math.min(p.y,yR-30)));});
  const endDraw=e=>{if(!drawing)return;const k=drawing;drawing=null;const p=svgPt(svg,e);const yt=Math.max(GY0+10,Math.min(p.y,yR-30));const afb=task.querySelector('#afb');
    if(Math.abs(yt-pk[k])<=18)run(()=>finishArrow(k));
    else{afb.className='fb warn';afb.textContent=yt>pk[k]?'السهم أقصر من المطلوب: ارفعيه حتى قمّة المنحنى.':'السهم تجاوز القمّة: توقّفي عند أعلى نقطة في المنحنى.';arrows[k].remove();arrows[k]=null;}};
  svg.addEventListener('pointerup',endDraw);svg.addEventListener('pointercancel',endDraw);
  async function autoArrow(k){const t0=yR-30;await tween(1800,t=>drawArrow(k,lerp(t0,pk[k],t)));await finishArrow(k);}
  function molFig(){const s=panel.querySelector('#molFig');let sd=11;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;const en=[];for(let i=0;i<30;i++)en.push(Math.min(.97,-Math.log(1-rnd()*.995)*.26));
    const thU=.72,thC=.3;
    [[0,'بدون إنزيم',thU,'#5E5873'],[165,'بوجود الإنزيم',thC,'#6B4BD0']].forEach(([x0,t,th,c])=>{const g=S('g',{transform:`translate(${x0} 0)`},s);S('rect',{x:4,y:24,width:148,height:150,rx:10,fill:'#F7F4FD'},g);
      const y=v=>168-v*140;let n=0;en.forEach((v,i)=>{const hi=v>=th;if(hi)n++;S('circle',{cx:14+(i%10)*13.5,cy:y(v),r:5,fill:hi?'#F28C28':'#C9C2DA'},g);});
      S('line',{x1:6,y1:y(th),x2:150,y2:y(th),stroke:c,'stroke-width':2.5,'stroke-dasharray':'6 4'},g);
      T(g,78,16,t,'mini');const r=T(g,78,194,ar(n)+' من '+ar(30)+' جزيئًا','mini');r.style.fill='#22193A';});}
  say('توقّعي أولًا: اضغطي على المسار الذي تتوقّعين أن طاقة تنشيطه أقل.');
  return{step(){if(phase==='predict')say('اختاري توقّعكِ أولًا بالضغط على إحدى البطاقتين.','warn');else if(phase==='predicted')run(reveal);else if(phase==='arrow'&&!drawing)run(()=>autoArrow(cur));}};
}

/* ---------- Registry & routing ---------- */
const ST={
  s1:{n:1,title:'القفل والمفتاح والتلاؤم المستحث',desc:'اسحبي المادة المتفاعلة إلى نموذجين وقارني الموقع النشط قبل الارتباط وبعده.',build:st1},
  s2:{n:2,title:'ماذا يحدث بعد الارتباط؟',desc:'حرّكي التفاعل خطوة خطوة حتى يتحرّر الناتج، ثم أعيدي استخدام الإنزيم نفسه.',build:st2},
  s3:{n:3,title:'التفكيك والبناء',desc:'تجربتان: جزيء يتفكّك إلى ناتجين، وجزيئان يرتبطان في ناتج واحد.',build:st3},
  s4:{n:4,title:'الليزوزيم في قطرة دمع',desc:'كبّري المشهد من قطرة الدمع حتى جدار الخلية البكتيرية وتابعي التحلّل المائي.',build:st4},
  s5:{n:5,title:'خفض طاقة التنشيط',desc:'المحطة الختامية: توقّعي، قارني المنحنيين، وارسمي سهمي طاقة التنشيط.',build:st5,final:true}
};
const IDS=Object.keys(ST);
function renderCards(){const c=$('#cards');c.innerHTML='';
  IDS.forEach(id=>{const s=ST[id];const done=store.done[id];const b=H(`<button class="st-card ${s.final?'final':''}" type="button"><span class="st-num">${ar(s.n)}</span><h3>${s.title}</h3><p>${s.desc}</p><span class="chip ${done?'done':''}">${done?'مكتملة ✓':(s.final?'المحطة الختامية':'لم تكتمل بعد')}</span></button>`);b.onclick=()=>{location.hash=id;};c.append(b);});
  const rb=$('#resumeBtn');if(store.last&&ST[store.last]){rb.textContent='متابعة: المحطة '+ar(ST[store.last].n);rb.onclick=()=>{location.hash=store.last;};}else{rb.textContent='ابدئي من المحطة الأولى';rb.onclick=()=>{location.hash='s1';};}}
$('#clearBtn').onclick=()=>{store={done:{},last:null};save();renderCards();};
function showHome(){A.gen++;setPause(false);$('#lab').hidden=true;$('#home').hidden=false;renderCards();window.scrollTo(0,0);}
function openStation(id){
  A.gen++;setPause(false);busy=false;
  const box=$('#stageBox');box.innerHTML='';
  const svg=S('svg',{id:'stage',viewBox:'0 0 1000 600',role:'img','aria-label':'مسرح التجربة'},box);defs(svg);
  const panel=$('#panel');panel.innerHTML='';say('');
  const s=ST[id];$('#labNum').textContent=ar(s.n);$('#labTitle').textContent=s.title;document.title='نموش في مختبر الإنزيمات · '+s.title;
  $('#labNum').style.background=s.final?'var(--orange-l)':'';$('#labNum').style.color=s.final?'var(--orange-d)':'';
  const i=IDS.indexOf(id);$('#prevBtn').disabled=i===0;$('#nextBtn').disabled=i===IDS.length-1;
  const ctx={svg,panel,done:()=>markDone(id),reload:()=>openStation(id),markSub:k=>{store['s3'+k]=true;if(store.s3break&&store.s3build)markDone('s3');else save();}};
  cur={id,api:s.build(ctx)};
}
function showLab(id){$('#home').hidden=true;$('#lab').hidden=false;store.last=id;save();window.scrollTo(0,0);openStation(id);}
function route(){const h=location.hash.replace('#','');if(ST[h])showLab(h);else showHome();}
$('#menuBtn').onclick=()=>{location.hash='home';};
$('#prevBtn').onclick=()=>{const i=IDS.indexOf(cur.id);if(i>0)location.hash=IDS[i-1];};
$('#nextBtn').onclick=()=>{const i=IDS.indexOf(cur.id);if(i<IDS.length-1)location.hash=IDS[i+1];};
$('#stepBtn').onclick=()=>{if(A.paused){say('التجربة متوقّفة. اضغطي «متابعة» أولًا.','warn');return;}if(cur&&cur.api)cur.api.step();};
$('#pauseBtn').onclick=()=>setPause(!A.paused);
$('#resetBtn').onclick=()=>{if(cur)openStation(cur.id);};
window.addEventListener('hashchange',route);
const ready=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
ready.then(route);
})();
</script>
